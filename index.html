<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app loaded" id="app">

  <header class="topbar">
    <div class="avatar">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="20" fill="#3a4152"/>
        <circle cx="20" cy="16" r="6" fill="#cfd4e2"/>
        <path d="M7 36c2-8 8-12 13-12s11 4 13 12" fill="#cfd4e2"/>
      </svg>
    </div>
    <div class="title">Кошелёк</div>
    <button class="icon-btn" onclick="openSheet('scan')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/>
        <rect x="9.5" y="9.5" width="5" height="5" rx="1"/>
      </svg>
    </button>
  </header>

  <section class="balance">
    <div class="bal-label">Баланс</div>
    <div class="bal-value">
      <span id="balance">0,00</span><span class="cur">₴</span>
    </div>
    <div class="spark">
      <svg viewBox="0 0 300 40" preserveAspectRatio="none" width="100%" height="40">
        <defs>
          <linearGradient id="sparkg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#31c48d" stop-opacity=".35"/>
            <stop offset="1" stop-color="#31c48d" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M0 28 L25 24 L50 26 L75 20 L100 22 L125 16 L150 18 L175 12 L200 14 L225 8 L250 12 L275 6 L300 8 L300 40 L0 40 Z" fill="url(#sparkg)"/>
        <path d="M0 28 L25 24 L50 26 L75 20 L100 22 L125 16 L150 18 L175 12 L200 14 L225 8 L250 12 L275 6 L300 8" fill="none" stroke="#31c48d" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bal-change">
      <span class="up" id="changeAbs">+0,00 ₴</span>
      <span class="pill" id="changePct">↑ 0,00%</span>
      <span class="period">Весь час</span>
    </div>
  </section>

  <section class="promo" onclick="openSheet('promo')">
    <div class="promo-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="13" rx="2"/>
        <path d="M3 12h18M12 8v13"/>
        <path d="M12 8s-2-5-5-5a2.5 2.5 0 0 0 0 5h5zM12 8s2-5 5-5a2.5 2.5 0 0 1 0 5h-5z"/>
      </svg>
    </div>
    <div class="promo-text">
      <div class="promo-title">Візьміть участь, щоб виграти до $100</div>
      <div class="promo-sub">Винагорода за завершення налаштування</div>
    </div>
    <div class="chev">›</div>
  </section>

  <section class="quick">
    <button onclick="openSheet('send')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3z"/></svg>
      </span>
      <span class="qa-label">Переказати</span>
    </button>
    <button onclick="openSheet('topup')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </span>
      <span class="qa-label">Внести</span>
    </button>
    <button onclick="openSheet('withdraw')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16V8M8 12l4-4 4 4"/></svg>
      </span>
      <span class="qa-label">Вивести</span>
    </button>
    <button onclick="openSheet('swap')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
      </span>
      <span class="qa-label">Обмін</span>
    </button>
  </section>

  <section class="ipo" id="ipoBanner">
    <div class="ipo-left">
      <div class="ipo-timer">Онга IPO за <span id="ipoTimer">50:57:01</span></div>
      <div class="ipo-cta">Подати заявку <span class="arrow">›</span></div>
    </div>
    <div class="ipo-right">
      <div class="ipo-badge">IPO</div>
      <div class="ipo-ring"></div>
    </div>
    <button class="ipo-close" onclick="event.stopPropagation();document.getElementById('ipoBanner').style.display='none'">✕</button>
    <div class="ipo-dots">
      <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </section>

  <section class="assets" id="assets"></section>

  <nav class="tabbar">
    <button class="tab active" data-tab="wallet">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>Wallet</span>
    </button>
    <button class="tab" data-tab="trade">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 12l4 4 6-8"/><path d="M20 8h-4M20 8v4"/></svg>
      <span>Торгівля</span>
    </button>
    <button class="tab" data-tab="profit">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2.5"/><path d="M9 3h6"/></svg>
      <span>Прибуток</span>
    </button>
    <button class="tab" data-tab="bonus">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.6 1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>
      <span>Бонуси</span>
    </button>
  </nav>

  <div class="footer-handle">@wallet</div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner" id="sheetContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>

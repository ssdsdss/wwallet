<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="avatar" id="avatar">
      <svg viewBox="0 0 40 40" width="40" height="40">
        <circle cx="20" cy="20" r="20" fill="#3a3a44"/>
        <circle cx="20" cy="16" r="6" fill="#cfcfd6"/>
        <path d="M8 34c2-7 7-10 12-10s10 3 12 10" fill="#cfcfd6"/>
      </svg>
    </div>
    <div class="title">Кошелёк</div>
    <button class="icon-btn" onclick="openSheet('scan')">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg>
    </button>
  </header>

  <!-- BALANCE -->
  <section class="balance">
    <div class="bal-label">Баланс</div>
    <div class="bal-value"><span id="balance">0,00</span> <span class="cur">₴</span></div>
    <div class="bal-change">
      <span class="up" id="changeAbs">+0,00 ₴</span>
      <span class="pill" id="changePct">↑ 0,00%</span>
      <span class="period">Весь час</span>
    </div>
  </section>

  <!-- PROMO BANNER -->
  <section class="promo" onclick="openSheet('promo')">
    <div class="promo-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8">
        <rect x="3" y="8" width="18" height="13" rx="2"/>
        <path d="M3 12h18M12 8v13"/>
        <path d="M12 8s-2-5-5-5a2.5 2.5 0 0 0 0 5h5zM12 8s2-5 5-5a2.5 2.5 0 0 1 0 5h-5z"/>
      </svg>
    </div>
    <div class="promo-text">
      <div class="promo-title">Візьміть участь, щоб виграти до $100</div>
      <div class="promo-sub">Винагорода за завершення налаштування</div>
    </div>
    <div class="chev">›</div>
  </section>

  <!-- QUICK ACTIONS -->
  <section class="quick">
    <button onclick="openSheet('send')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8">
          <path d="M21 3 3 10l7 3 3 7 8-17z"/>
        </svg>
      </span>
      <span class="qa-label">Переказати</span>
    </button>
    <button onclick="openSheet('topup')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>
      </span>
      <span class="qa-label">Внести</span>
    </button>
    <button onclick="openSheet('withdraw')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 16V8M8 12l4-4 4 4"/>
        </svg>
      </span>
      <span class="qa-label">Вивести</span>
    </button>
    <button onclick="openSheet('swap')">
      <span class="qa-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8">
          <path d="M4 8h13l-3-3M20 16H7l3 3"/>
        </svg>
      </span>
      <span class="qa-label">Обмін</span>
    </button>
  </section>

  <!-- IPO BANNER -->
  <section class="ipo">
    <div class="ipo-left">
      <div class="ipo-timer">Онга IPO за <span id="ipoTimer">50:57:01</span></div>
      <div class="ipo-cta">Подати заявку ›</div>
    </div>
    <div class="ipo-right">
      <div class="ipo-badge">IPO</div>
      <div class="ipo-coin">◎</div>
    </div>
    <button class="ipo-close" onclick="event.stopPropagation();this.parentElement.style.display='none'">✕</button>
    <div class="ipo-dots">
      <span class="dot active"></span><span class="dot"></span><span class="dot"></span>
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
  </section>

  <!-- DOLLARS CARD -->
  <section class="asset" onclick="openSheet('asset')">
    <div class="asset-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#0b0e14">
        <text x="12" y="17" text-anchor="middle" font-size="16" font-weight="700">$</text>
      </svg>
    </div>
    <div class="asset-main">
      <div class="asset-title">Долари</div>
      <div class="asset-sub">USDT · 44,78 ₴</div>
    </div>
    <div class="asset-right">
      <div class="asset-amount">8,94 ₴</div>
      <div class="asset-change">+0,33 ₴</div>
    </div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="tabbar">
    <button class="tab active" data-tab="wallet">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="7" width="18" height="12" rx="2"/>
        <path d="M3 10h18"/>
      </svg>
      <span>Wallet</span>
    </button>
    <button class="tab" data-tab="trade">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 18 10 12l4 4 6-8"/>
      </svg>
      <span>Торгівля</span>
    </button>
    <button class="tab" data-tab="profit">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8"/>
        <path d="M12 8v4l2 2"/>
        <path d="M9 3h6"/>
      </svg>
      <span>Прибуток</span>
    </button>
    <button class="tab" data-tab="bonus">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.7 7.1 18.2 8 12.7 4 8.8 9.5 8z"/>
      </svg>
      <span>Бонуси</span>
    </button>
  </nav>

  <div class="footer-handle">@wallet</div>
</div>

<!-- SHEET -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner" id="sheetContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>
